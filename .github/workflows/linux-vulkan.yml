name: Linux Vulkan and SDK qualification

on:
  push:
    branches: [Vulkan-V2-Integration, Experimental]
  pull_request:
    branches: [Vulkan-V2-Integration, Experimental]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vulkan-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      SDL_VIDEODRIVER: x11
      SDL_AUDIODRIVER: dummy
      LIBGL_ALWAYS_SOFTWARE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      CCACHE_DIR: /home/runner/.cache/ccache
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Ubuntu development and software graphics packages
        run: |
          {
            echo "XDG_CACHE_HOME=$RUNNER_TEMP/judas-cache"
            echo "XDG_CONFIG_HOME=$RUNNER_TEMP/judas-config"
            echo "XDG_DATA_HOME=$RUNNER_TEMP/judas-data"
          } >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ ccache libsdl2-dev libglm-dev xvfb xauth libgl1-mesa-dri mesa-vulkan-drivers libvulkan-dev glslang-dev glslang-tools spirv-tools vulkan-validationlayers
          icd=$(dpkg-query -L mesa-vulkan-drivers | grep '/lvp_icd[^/]*\.json$')
          test -f "$icd"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        id: build-cache
        with:
          path: |
            ~/.cache/ccache
            build/unicode
          key: ubuntu-24.04-vulkan-v1-${{ github.sha }}
          restore-keys: ubuntu-24.04-vulkan-v1-
      - name: Capture provenance and configure Release SDK
        run: |
          python3 scripts/prealpha_build_identity_checks.py --output "$RUNNER_TEMP/build-identity.json"
          python3 tools/vulkan/debian_compiler_notices.py "$RUNNER_TEMP/vulkan-notices"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DJUDAS_BUILD_CHANNEL=Experimental \
            -DJUDAS_ENABLE_VALIDATION=ON -DJUDAS_VULKAN=ON -DJUDAS_SDK_RELEASE=ON \
            -DJUDAS_VULKAN_PACKAGE_METADATA="$RUNNER_TEMP/vulkan-notices" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build native tests and SDK
        run: cmake --build build --target judas_prealpha_tests judas_linux_sdk -j2
      - uses: actions/cache/save@v4
        if: steps.build-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cache/ccache
            build/unicode
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Verify and relocate the staged SDK
        run: |
          sdk="$RUNNER_TEMP/relocated-sdk"
          mv build/linux-vulkan-sdk "$sdk"
          python3 "$sdk/tools/inspect_sdk.py" "$sdk" --host-check --max-glibc 2.39 --require-os ubuntu:24.04 --output "$RUNNER_TEMP/SDK_ABI.json"
          python3 "$sdk/tools/package_sdk.py" verify "$sdk"
      - name: Exercise Vulkan rendering and compute contracts
        run: |
          xvfb-run -a python3 scripts/prealpha_validate.py --graphics-backend vulkan --graphics-profile modern \
            --expected-channel Experimental --output "$RUNNER_TEMP/vulkan-native" \
            --test renderer-v2-submission --test rendering-architecture --test renderer-shadow-reuse \
            --test render-cameras --test terrain-v2-transition --test particle-gpu-resident \
            --test water-visuals --test editor-application-lifecycle --test editor-v2-viewports
      - name: Exercise shared renderer on OpenGL and Vulkan
        run: |
          python3 -m unittest discover -s tests -p test_vulkan_parity.py
          python3 tools/vulkan/compare_backends.py --build-dir "$RUNNER_TEMP/relocated-sdk" \
            --device llvmpipe --profile portable --output "$RUNNER_TEMP/parity" --frames 32 \
            --shot 8 --shot 17 --shot 28 --script-line 'RESIZE 960 540 12' --script-line 'RESIZE 1280 720 22' \
            --max-pixels-over8 0.1 --require-simulation-match \
            projects/renderer_v2_lab/renderer_v2_lab.judasproj projects/ui_showcase/ui_showcase.judasproj
      - name: Qualify authoring and relocated exports with both backends
        run: |
          sdk="$RUNNER_TEMP/relocated-sdk"
          VK_DRIVER_FILES=/dev/null xvfb-run -a python3 scripts/qualify_sdk.py --sdk "$sdk" --work "$RUNNER_TEMP/sdk-opengl"
          xvfb-run -a python3 scripts/qualify_sdk.py --vulkan --sdk "$sdk" --work "$RUNNER_TEMP/sdk-vulkan"
      - name: Reject a Vulkan request without a usable driver
        run: |
          sdk="$RUNNER_TEMP/relocated-sdk"
          project="$RUNNER_TEMP/sdk-opengl/moved-cli-export/game.judasproj"
          if timeout 30s xvfb-run -a env VK_DRIVER_FILES=/dev/null JUDAS_GRAPHICS=vulkan \
            "$sdk/judas" "$project" > "$RUNNER_TEMP/no-vulkan-driver.log" 2>&1; then
            echo 'An explicit Vulkan request unexpectedly succeeded without an ICD'
            exit 1
          fi
          grep 'Cannot start the Vulkan backend:' "$RUNNER_TEMP/no-vulkan-driver.log"
          ! grep '\[Graphics\] created OpenGL' "$RUNNER_TEMP/no-vulkan-driver.log"
      - name: Run the full registered native suite
        run: xvfb-run -a ctest --test-dir build -L prealpha -j2 --output-on-failure
      - name: Archive the qualified Linux SDK
        run: |
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -C "$RUNNER_TEMP" --transform='s,^relocated-sdk,judas-linux-sdk,' -cf - relocated-sdk \
            | gzip -n > "$RUNNER_TEMP/judas-linux-vulkan-sdk.tar.gz"
          cd "$RUNNER_TEMP"
          sha256sum judas-linux-vulkan-sdk.tar.gz > judas-linux-vulkan-sdk.tar.gz.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: judas-linux-vulkan-sdk-${{ github.sha }}
          path: ${{ runner.temp }}/judas-linux-vulkan-sdk.tar.gz*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vulkan-qualification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/SDK_ABI.json
            ${{ runner.temp }}/build-identity.json
            ${{ runner.temp }}/no-vulkan-driver.log
            ${{ runner.temp }}/parity/RESULTS.json
            ${{ runner.temp }}/parity/*/*/*.log
            ${{ runner.temp }}/sdk-*/*.json
            ${{ runner.temp }}/sdk-*/*.log
            ${{ runner.temp }}/vulkan-native/*.log
            ${{ runner.temp }}/vulkan-native/RESULTS.json
            build/Testing/Temporary/
          retention-days: 14
