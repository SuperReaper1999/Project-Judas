name: Prepare release candidate (never publishes)
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact 40-character Experimental candidate commit
        required: true
        type: string
      channel:
        description: Private candidate channel (not a publication)
        required: true
        type: choice
        options: [Alpha, Experimental, Beta, Stable]
        default: Alpha
permissions:
  contents: read
concurrency:
  group: prepare-judas-${{ inputs.candidate }}-${{ inputs.channel }}
  cancel-in-progress: false
jobs:
  linux:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CANDIDATE: ${{ inputs.candidate }}
      CHANNEL: ${{ inputs.channel }}
      SDL_AUDIODRIVER: dummy
      LIBGL_ALWAYS_SOFTWARE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Validate literal commit input
        run: python3 -c 'import os,re; assert re.fullmatch("[0-9a-f]{40}",os.environ["CANDIDATE"])'
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate }}
          persist-credentials: false
      - name: Snapshot exact tracked source before qualification
        run: |
          mkdir -p "$RUNNER_TEMP/prepared"
          python3 tools/package_source.py --output "$RUNNER_TEMP/prepared/source.tar.gz" --channel "$CHANNEL"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libsdl2-dev libglm-dev xvfb xauth libgl1-mesa-dri
          npm ci --ignore-scripts --prefix tools/verification
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DJUDAS_BUILD_CHANNEL="$CHANNEL" -DJUDAS_ENABLE_VALIDATION=ON -DJUDAS_SDK_RELEASE=ON
          cmake --build build --target judas_linux_sdk -j2
          xvfb-run -a python3 scripts/qualify_m100.py --build build --output .cache/release-qualification --jobs 2
          xvfb-run -a python3 scripts/qualify_sdk.py --sdk build/linux-sdk --work .cache/release-sdk-work
          node scripts/check_judasjs_api.mjs
          python3 tools/inspect_sdk.py build/linux-sdk --host-check --max-glibc 2.39 --require-os ubuntu:24.04 --output .cache/release-sdk-platform.json
      - name: Pack qualified SDK and tracked source as immutable CI artifacts
        run: |
          git diff --exit-code HEAD
          tar -C build -czf "$RUNNER_TEMP/prepared/linux-sdk.tar.gz" linux-sdk
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-Linux-${{ inputs.candidate }}-${{ inputs.channel }}
          path: |
            ${{ runner.temp }}/prepared/
            .cache/release-qualification/
            .cache/release-sdk-work/RESULTS.json
            .cache/release-sdk-work/COMPLETE.json
            .cache/release-sdk-platform.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: candidate-Linux-failure-${{ inputs.candidate }}
          path: |
            .cache/release-qualification/
            .cache/release-sdk-work/
            build/Testing/Temporary/
          include-hidden-files: true
          retention-days: 14
  windows:
    if: github.actor == github.repository_owner
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      CANDIDATE: ${{ inputs.candidate }}
      CHANNEL: ${{ inputs.channel }}
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Validate literal commit input
        shell: pwsh
        run: if ($env:CANDIDATE -notmatch '^[0-9a-f]{40}$') { throw 'Exact commit required' }
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate }}
          persist-credentials: false
      - name: Build complete native MSVC SDK
        shell: pwsh
        run: |
          # Avoid the pinned vcpkg helper's expired MSYS2 runtime download.
          $installer = Join-Path $env:RUNNER_TEMP 'pkgconf.msi'
          Invoke-WebRequest 'https://github.com/pkgconf/pkgconf/releases/download/pkgconf-3.0.8/pkgconf-x64-3.0.8.msi' -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne 'A236479BBE403B202816745BEF19AFE2D6240606F28AB1F008BA0F33FBFAE43E') { throw 'pkgconf installer checksum mismatch' }
          $destination = Join-Path $env:RUNNER_TEMP 'pkgconf'
          $installLog = Join-Path $env:RUNNER_TEMP 'pkgconf-install.log'
          $extract = Start-Process msiexec.exe -ArgumentList @('/a', "`"$installer`"", '/qn', '/L*V', "`"$installLog`"", "TARGETDIR=`"$destination`"") -Wait -PassThru
          if ($extract.ExitCode -ne 0) {
            Get-Content $installLog -Tail 60 -ErrorAction SilentlyContinue
            throw "pkgconf extraction failed: $($extract.ExitCode)"
          }
          $pkgconf = Get-ChildItem $destination -Recurse -Filter pkgconf.exe | Select-Object -First 1
          if (!$pkgconf) { throw 'Native pkgconf executable missing after extraction' }
          & $pkgconf.FullName --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Hosted windows-2025 now supplies VS 2026; retain VS 2022 locally.
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vsVersion = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion
          if ($LASTEXITCODE -or !$vsVersion) { throw 'MSVC installation not found' }
          $generator = switch (([version]$vsVersion).Major) {
            17 { 'Visual Studio 17 2022' }
            18 { 'Visual Studio 18 2026' }
            default { throw "Unqualified Visual Studio installation: $vsVersion" }
          }
          ./packaging/windows/Build-Windows.ps1 -Channel $env:CHANNEL -Jobs 2 -ReleasePackage -PkgConfig $pkgconf.FullName -Generator $generator
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $build = "build/windows-$env:CHANNEL"
          cmake --build $build --config Release --target judas_build_identity_tests judas_release_update_tests judas_mk2_rotation_tests judas_network_transport_tests judas_consumer_pointer_tests --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$build/Release/judas_build_identity_tests.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$build/Release/judas_release_update_tests.exe" tests/fixtures/releases/update-cases.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$build/Release/judas_mk2_rotation_tests.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$build/Release/judas_network_transport_tests.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$build/Release/judas_consumer_pointer_tests.exe" "$env:RUNNER_TEMP/consumer-pointer" "$env:GITHUB_WORKSPACE/tests/fixtures/pointer-taps"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/inspect_sdk.py "$build/windows-sdk" --host-check --system-directory C:/Windows/System32 --output windows-sdk-qualification.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          'Windows hosted CI qualifies native tools and selected contracts; editor/GL/export behaviour requires the documented native desktop/VM qualification. No hardware claim.' | Set-Content windows-ci-scope.txt
          tar -C $build -czf windows-sdk.tar.gz windows-sdk
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-Windows-${{ inputs.candidate }}-${{ inputs.channel }}
          path: |
            windows-sdk.tar.gz
            windows-sdk-qualification.json
            windows-ci-scope.txt
          if-no-files-found: error
          retention-days: 14
