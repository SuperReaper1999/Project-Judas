name: Prepare release candidate (never publishes)
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact 40-character Experimental candidate commit
        required: true
        type: string
      channel:
        description: Private candidate channel (not a publication)
        required: true
        type: choice
        options: [Alpha, Experimental, Beta, Stable]
        default: Alpha
      platform:
        description: Both platforms required for release proof; single platform is investigation only
        required: true
        type: choice
        options: [both, linux, windows]
        default: both
permissions:
  contents: read
concurrency:
  group: prepare-judas-${{ inputs.candidate }}-${{ inputs.channel }}
  cancel-in-progress: false
jobs:
  linux:
    if: github.actor == github.repository_owner && inputs.platform != 'windows'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CANDIDATE: ${{ inputs.candidate }}
      CHANNEL: ${{ inputs.channel }}
      SDL_AUDIODRIVER: dummy
      LIBGL_ALWAYS_SOFTWARE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      CCACHE_DIR: /home/runner/.cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1G
    steps:
      - name: Validate literal commit input
        run: python3 -c 'import os,re; assert re.fullmatch("[0-9a-f]{40}",os.environ["CANDIDATE"])'
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate }}
          persist-credentials: false
      - name: Verify release and status documentation before building
        run: python3 tools/release_docs.py
      - name: Snapshot exact tracked source before qualification
        run: |
          mkdir -p "$RUNNER_TEMP/prepared"
          python3 tools/package_source.py --output "$RUNNER_TEMP/prepared/source.tar.gz" --channel "$CHANNEL"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/verification/package-lock.json
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ ccache libsdl2-dev libglm-dev xvfb xauth libgl1-mesa-dri
          npm ci --ignore-scripts --prefix tools/verification
      - name: Identify Linux compiler
        id: compiler
        run: |
          echo "version=$(g++ -dumpfullversion)-$(sha256sum "$(g++ -print-prog-name=cc1plus)" | cut -c1-12)" >> "$GITHUB_OUTPUT"
          nproc
          free -m
      - name: Restore Linux compiler objects
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: linux-gcc-${{ steps.compiler.outputs.version }}-objects-v1-${{ inputs.candidate }}-candidate
          restore-keys: linux-gcc-${{ steps.compiler.outputs.version }}-objects-v1-
      - name: Reuse Linux ICU
        uses: actions/cache@v4
        with:
          path: build/unicode
          key: linux-gcc-${{ steps.compiler.outputs.version }}-icu-v1-${{ hashFiles('third_party/text/*', 'cmake/JudasTextDependencies.cmake') }}
      - name: Configure exact Linux release candidate
        run: |
          ccache --zero-stats
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DJUDAS_BUILD_CHANNEL="$CHANNEL" -DJUDAS_ENABLE_VALIDATION=ON -DJUDAS_SDK_RELEASE=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build Linux SDK
        run: |
          cmake --build build --target judas_linux_sdk -j2
      - name: Complete Linux qualification
        run: |
          xvfb-run -a python3 scripts/qualify_m100.py --build build --output .cache/release-qualification --jobs 2
      - name: Linux SDK authoring and relocated exports
        run: |
          xvfb-run -a python3 scripts/qualify_sdk.py --sdk build/linux-sdk --work .cache/release-sdk-work
      - name: Linux API and ABI qualification
        run: |
          node scripts/check_judasjs_api.mjs
          python3 tools/inspect_sdk.py build/linux-sdk --host-check --max-glibc 2.39 --require-os ubuntu:24.04 --output .cache/release-sdk-platform.json
      - name: Linux compiler cache statistics
        if: always()
        run: ccache --show-stats
      - name: Pack qualified SDK and tracked source as immutable CI artifacts
        run: |
          git diff --exit-code HEAD
          tar -C build -czf "$RUNNER_TEMP/prepared/linux-sdk.tar.gz" linux-sdk
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-Linux-${{ inputs.candidate }}-${{ inputs.channel }}
          path: |
            ${{ runner.temp }}/prepared/
            .cache/release-qualification/
            .cache/release-sdk-work/RESULTS.json
            .cache/release-sdk-work/COMPLETE.json
            .cache/release-sdk-platform.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: candidate-Linux-failure-${{ inputs.candidate }}
          path: |
            .cache/release-qualification/
            .cache/release-sdk-work/
            build/Testing/Temporary/
          include-hidden-files: true
          retention-days: 14
  windows:
    if: github.actor == github.repository_owner && inputs.platform != 'linux'
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      CANDIDATE: ${{ inputs.candidate }}
      CHANNEL: ${{ inputs.channel }}
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - name: Validate literal commit input
        shell: pwsh
        run: if ($env:CANDIDATE -notmatch '^[0-9a-f]{40}$') { throw 'Exact commit required' }
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate }}
          persist-credentials: false
      - name: Verify release and status documentation before building
        run: python tools/release_docs.py
      - name: Native compiler cache
        uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11
        with:
          version: v0.16.0
      - name: Identify Windows image
        id: image
        shell: pwsh
        run: |
          "version=$env:ImageVersion" >> $env:GITHUB_OUTPUT
          Get-CimInstance Win32_ComputerSystem | Select-Object NumberOfLogicalProcessors,TotalPhysicalMemory
      - name: Reuse Windows dependency builds
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/vcpkg/archives
            build/windows-${{ inputs.channel }}/unicode
          key: windows-native-${{ steps.image.outputs.version }}-${{ inputs.channel }}-deps-v1-${{ hashFiles('packaging/windows/vcpkg.json', 'cmake/JudasWindowsICU.cmake', 'third_party/text/*') }}
      - name: Build complete native MSVC SDK
        shell: pwsh
        run: |
          # Avoid the pinned vcpkg helper's expired MSYS2 runtime download.
          $installer = Join-Path $env:RUNNER_TEMP 'pkgconf.msi'
          Invoke-WebRequest 'https://github.com/pkgconf/pkgconf/releases/download/pkgconf-3.0.8/pkgconf-x64-3.0.8.msi' -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne 'A236479BBE403B202816745BEF19AFE2D6240606F28AB1F008BA0F33FBFAE43E') { throw 'pkgconf installer checksum mismatch' }
          $destination = Join-Path $env:RUNNER_TEMP 'pkgconf'
          $installLog = Join-Path $env:RUNNER_TEMP 'pkgconf-install.log'
          $extract = Start-Process msiexec.exe -ArgumentList @('/a', "`"$installer`"", '/qn', '/L*V', "`"$installLog`"", "TARGETDIR=`"$destination`"") -Wait -PassThru
          if ($extract.ExitCode -ne 0) {
            Get-Content $installLog -Tail 60 -ErrorAction SilentlyContinue
            throw "pkgconf extraction failed: $($extract.ExitCode)"
          }
          $pkgconf = Get-ChildItem $destination -Recurse -Filter pkgconf.exe | Select-Object -First 1
          if (!$pkgconf) { throw 'Native pkgconf executable missing after extraction' }
          & $pkgconf.FullName --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Hosted windows-2025 now supplies VS 2026; retain VS 2022 locally.
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vsVersion = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion
          if ($LASTEXITCODE -or !$vsVersion) { throw 'MSVC installation not found' }
          $vsPath = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          & "$vsPath/Common7/Tools/Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          sccache --zero-stats
          ./packaging/windows/Build-Windows.ps1 -Channel $env:CHANNEL -Jobs 2 -ReleasePackage -PkgConfig $pkgconf.FullName -Generator Ninja -CompilerLauncher sccache
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $build = "build/windows-$env:CHANNEL"
          $bin = $build
          $aiTargets = @('judas_utility_ai_tests', 'judas_utility_ai_script_tests', 'judas_utility_ai_editor_tests', 'judas_ai_workflow_tests', 'judas_ai_reservation_tests', 'judas_ai_reservation_script_tests', 'judas_ai_sensing_tests', 'judas_ai_sensing_script_tests')
          cmake --build $build --config Release --target judas_build_identity_tests judas_release_update_tests judas_mk2_rotation_tests judas_network_transport_tests judas_consumer_pointer_tests judas_one_way_platform_tests judas_grid_movement_tests judas_planar_physics_tests judas_tilemap_tests judas_sprite_animation_tests judas_editor_script_workflow_tests judas_ui_drag_tests $aiTargets --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$bin/judas_build_identity_tests.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$bin/judas_release_update_tests.exe" tests/fixtures/releases/update-cases.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$bin/judas_mk2_rotation_tests.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$bin/judas_network_transport_tests.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$bin/judas_consumer_pointer_tests.exe" "$env:RUNNER_TEMP/consumer-pointer" "$env:GITHUB_WORKSPACE/tests/fixtures/pointer-taps"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$bin/judas_planar_physics_tests.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$bin/judas_one_way_platform_tests.exe" "$env:RUNNER_TEMP/one-way-release"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$bin/judas_one_way_platform_tests.exe" "$env:RUNNER_TEMP/one-way-release" --cold
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$bin/judas_grid_movement_tests.exe" "$env:RUNNER_TEMP/grid-release"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$bin/judas_grid_movement_tests.exe" "$env:RUNNER_TEMP/grid-release" --cold
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$bin/judas_grid_movement_tests.exe" "$env:RUNNER_TEMP/grid-release" --cold-queue
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$bin/judas_tilemap_tests.exe" "$env:RUNNER_TEMP/tilemap-release"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$bin/judas_sprite_animation_tests.exe" "$env:RUNNER_TEMP/animation-release"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$bin/judas_editor_script_workflow_tests.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$bin/judas_ui_drag_tests.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # These AI contracts use native physics/script/editor-model code, not
          # a hosted desktop/GL session. Keep graphics qualification separate.
          New-Item -ItemType Directory -Path windows-ai-qualification -Force | Out-Null
          $aiFailures = @()
          $aiResults = @()
          foreach ($test in $aiTargets) {
            $log = "windows-ai-qualification/$test.log"
            & "$bin/$test.exe" *> $log
            $result = $LASTEXITCODE
            Get-Content $log
            $aiResults += @{ name = $test; exit = $result; log = $log }
            if ($result) { $aiFailures += "$test failed: $result" }
          }
          $aiResults | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 windows-ai-qualification/RESULTS.json
          foreach ($mode in @('write', 'read')) {
            $log = "windows-ai-qualification/reservation-$mode.log"
            & "$bin/judas_ai_reservation_script_tests.exe" $mode "$env:RUNNER_TEMP/ai-reservation-cold" *> $log
            $result = $LASTEXITCODE
            Get-Content $log
            if ($result) { throw "AI reservation cold $mode failed: $result" }
          }
          if ($aiFailures.Count) { throw ($aiFailures -join '; ') }
          python tools/inspect_sdk.py "$build/windows-sdk" --host-check --system-directory C:/Windows/System32 --output windows-sdk-qualification.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          'Windows hosted CI qualifies native tools and selected contracts; editor/GL/export behaviour requires the documented native desktop/VM qualification. No hardware claim.' | Set-Content windows-ci-scope.txt
          tar -C $build -czf windows-sdk.tar.gz windows-sdk
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-Windows-${{ inputs.candidate }}-${{ inputs.channel }}
          path: |
            windows-sdk.tar.gz
            windows-sdk-qualification.json
            windows-ci-scope.txt
            windows-ai-qualification/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: candidate-Windows-failure-${{ inputs.candidate }}
          path: |
            windows-ai-qualification/
            windows-sdk-qualification.json
            build/windows-*/judas-build-info-Release.json
          if-no-files-found: warn
          retention-days: 14
