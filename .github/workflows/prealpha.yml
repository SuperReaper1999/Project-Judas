name: Engine focused gates

on:
  push:
    branches: [Experimental, main]
    paths-ignore: [
      'docs/evidence/**', 'docs/**/*.md', 'docs/*.txt', '*.md', '.github/workflows/**', '.gitignore',
      'scripts/check_ci_promotion.py', 'scripts/check_current_docs.py',
      'scripts/qualify_m100.py', 'scripts/qualify_sdk.py', 'scripts/qualify_sdk_workflows.py',
      'tests/test_ci_workflows.py', 'tests/test_release_packaging.py', 'tests/test_release_manifest.py',
      'tools/assemble_release_run.py', 'tools/prepare_release.py', 'tools/publish_release.py',
      'tools/release_manifest.py', 'tools/release_docs.py', 'tests/test_release_docs.py', 'docs/RELEASE_STATUS.json', 'docs/CURRENT_FINDINGS.json', 'tools/package_source.py', 'tools/generate_changelog.py', 'tools/verification/current-docs.json'
    ]
  pull_request:
    branches: [Experimental, main]
  workflow_dispatch:
    inputs:
      full:
        description: Run full qualification coverage instead of routine coverage
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: prealpha-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promotion:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: scripts/check_ci_promotion.py
          sparse-checkout-cone-mode: false
      - name: Verify exact completed Experimental qualification
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/check_ci_promotion.py
  linux:
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    name: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SDL_AUDIODRIVER: dummy
      LIBGL_ALWAYS_SOFTWARE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      CCACHE_DIR: /home/runner/.cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/verification/package-lock.json
      - name: Native and optional verification prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ ccache libsdl2-dev libglm-dev xvfb libgl1-mesa-dri
          npm ci --ignore-scripts --prefix tools/verification
      - name: Identify compiler and runner
        id: compiler
        run: |
          echo "version=$(g++ -dumpfullversion)-$(sha256sum "$(g++ -print-prog-name=cc1plus)" | cut -c1-12)" >> "$GITHUB_OUTPUT"
          nproc
          free -m
          ccache --version
      - name: Restore compiler objects
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: linux-gcc-${{ steps.compiler.outputs.version }}-objects-v1-${{ github.sha }}
          restore-keys: linux-gcc-${{ steps.compiler.outputs.version }}-objects-v1-
      - name: Reuse immutable ICU build
        uses: actions/cache@v4
        with:
          path: build/unicode
          key: linux-gcc-${{ steps.compiler.outputs.version }}-icu-v1-${{ hashFiles('third_party/text/*', 'cmake/JudasTextDependencies.cmake') }}
      - name: Tooling positive and negative controls
        run: |
          python3 scripts/prealpha_build_identity_checks.py --output .cache/prealpha/ci/identity.json
          python3 scripts/prealpha_packaging_checks.py --output .cache/prealpha/ci/packaging.json
          python3 scripts/prealpha_distribution_checks.py --output .cache/prealpha/ci/distribution.json
          node tests/TypeScriptToolingTests.mjs
          node tests/CrashDrivingProjectTests.mjs
          node tests/PlayableCombinedProjectTests.mjs
          python3 -m unittest discover -s tests -p test_whole_engine_metrics.py
          node scripts/check_judasjs_api.mjs
      - name: Configure an explicitly identified build
        env:
          CHANNEL: Alpha
        run: |
          ccache --zero-stats
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DJUDAS_BUILD_CHANNEL="$CHANNEL" -DJUDAS_ENABLE_VALIDATION=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build focused dependencies and public SDK
        run: |
          target=judas_ci_tests
          if [ "${{ inputs.full }}" = true ]; then target=judas_prealpha_tests; fi
          cmake --build build --target "$target" judas_linux_sdk -j2
      - name: Focused native gates
        run: |
          label=routine
          if [ "${{ inputs.full }}" = true ]; then label=prealpha; fi
          xvfb-run -a ctest --test-dir build -L "$label" -j2 --output-on-failure
      - name: Qualify SDK on its declared Linux baseline
        run: |
          python3 build/linux-sdk/tools/inspect_sdk.py build/linux-sdk --host-check --max-glibc 2.39 --require-os ubuntu:24.04 --output .cache/prealpha/ci/sdk-qualification.json
          cd /tmp
          python3 "$GITHUB_WORKSPACE/build/linux-sdk/tools/package_sdk.py" verify "$GITHUB_WORKSPACE/build/linux-sdk"
      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats
      - name: Preserve diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prealpha-linux-${{ github.sha }}
          path: |
            .cache/prealpha/validation/
            .cache/prealpha/ci/
            build/judas-build-info-Release.json
            build/Testing/Temporary/
            build/linux-sdk/SDK_MANIFEST.json
            build/linux-sdk/BUILD_INFO.json
            build/linux-sdk/SHA256SUMS
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: ${{ job.status == 'success' && 3 || 14 }}
